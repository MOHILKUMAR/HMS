version: '3.8'

services:
  # 1. Relational PostgreSQL Database (With ACID & Row-Level Locking)
  postgres:
    image: postgres:16-alpine
    container_name: swastik-postgres
    restart: always
    environment:
      POSTGRES_USER: swastik_admin
      POSTGRES_PASSWORD: swastik_secure_password_2026
      POSTGRES_DB: swastik_hms
    ports:
      - "5432:5432"
    volumes:
      - swastik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swastik_admin -d swastik_hms"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: swastik-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - swastik_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Node.js + Express + Prisma Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swastik-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://swastik_admin:swastik_secure_password_2026@postgres:5432/swastik_hms?schema=public
      JWT_SECRET: swastik_hospital_super_secret_jwt_key_2026_production
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. React + TypeScript + Nginx Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swastik-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  swastik_pgdata:
    driver: local
  swastik_redisdata:
    driver: local
