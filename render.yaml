# Render Blueprint for 1-Click Deployment
# https://render.com/docs/blueprint-spec

databases:
  - name: swastik-hms-postgres
    databaseName: swastik_hms
    user: swastik_admin
    plan: starter
    region: singapore # Closest region to India for optimal latency

services:
  # Backend Node.js / Express / Prisma API Service
  - type: web
    name: swastik-hms-backend
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: swastik-hms-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Frontend React SPA Static Site
  - type: web
    name: swastik-hms-frontend
    runtime: static
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
